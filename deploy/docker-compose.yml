# agent-tools-mcp 的 Docker 部署。
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env          # 至少填 ATM_BASE_URL
#   cp ../configs/config.example.yaml config.yaml && $EDITOR config.yaml
#   docker compose up -d --build
#
# .env 与 config.yaml 都不入库（含域名、密码哈希、令牌）。

name: chatgpt-tools-mcp

services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
        AGENT_UID: ${AGENT_UID:-10001}
        AGENT_GID: ${AGENT_GID:-10001}
        SUDO_NOPASSWD: ${SUDO_NOPASSWD:-true}
    image: chatgpt-tools-mcp:${VERSION:-0.1.0}
    container_name: chatgpt-tools-mcp
    hostname: mcp
    restart: unless-stopped

    # 默认只映射到回环：HTTPS 与公网入口由 Cloudflare Tunnel / 反代提供。
    # 想让别的机器直连再把 BIND_ADDR 改成 0.0.0.0，但那样是明文 HTTP，
    # OAuth 口令和令牌会裸奔。
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8484}:8484"

    environment:
      # 必填。必须与 ChatGPT 里填的连接器地址逐字一致（scheme + 主机名，无尾斜杠），
      # OAuth 元数据、回调校验、资源标识全以它为准，写错了整条授权链路都不通。
      ATM_BASE_URL: ${ATM_BASE_URL:?请在 deploy/.env 里填 ATM_BASE_URL，例如 https://mcp.example.com}
      ATM_LOG_LEVEL: ${ATM_LOG_LEVEL:-info}
      ATM_LOG_FORMAT: ${ATM_LOG_FORMAT:-json}
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      - ./config.yaml:/etc/agent-tools-mcp/config.yaml:ro
      # OAuth 客户端注册表、令牌库、审计日志。别用 bind mount 挂到工作区里面，
      # 那等于把令牌库放在 agent 自己能写的地方。
      - mcp-data:/var/lib/agent-tools-mcp
      # agent 的工作区。想让它管别的目录就在这里继续挂，例如：
      #   - /srv/notes:/srv/notes
      - ./workspace:/workspace

    # 单核机器上不设硬性 cpu 上限（会拖慢正常的编译/测试），
    # 改用相对权重：只在争抢时让它退让给同机的其它服务。
    cpu_shares: 512
    # 这台机器没有 swap，超限就是 OOM kill，留足余量。
    mem_limit: ${MEM_LIMIT:-2g}
    memswap_limit: ${MEM_LIMIT:-2g}
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 8192
        hard: 65535

    # 刻意没有 security_opt: no-new-privileges —— 它会让镜像里的免密 sudo 失效。
    # 如果构建时传了 SUDO_NOPASSWD=false，可以把下面两行打开：
    # security_opt:
    #   - no-new-privileges:true

    stop_grace_period: 20s
    # agent 的命令输出可能很大，别让日志把磁盘吃光。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 可选：Cloudflare Tunnel 出公网，不必开入站端口也不必自己搞证书。
  # token 从 Cloudflare Zero Trust 控制台拿，Public hostname 指向 http://chatgpt-tools-mcp:8484。
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: chatgpt-tools-mcp-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:?}
  #   depends_on: [mcp]

volumes:
  mcp-data:

# 固定网络名，方便外部已有的 cloudflared 容器接进来：
#   docker network connect chatgpt-tools-mcp <cloudflared 容器名>
# 接进来后隧道的 Service 填 http://chatgpt-tools-mcp:8484。
networks:
  default:
    name: chatgpt-tools-mcp
