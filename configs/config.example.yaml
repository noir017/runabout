# runabout 配置示例
#
# 所有字段都有默认值，只写要改的即可。环境变量优先级高于本文件：
#   RB_LISTEN / RB_BASE_URL / RB_DATA_DIR / RB_USER / RB_PASSWORD_HASH
#   RB_STATIC_TOKEN / RB_AUTH_DISABLED / RB_LOG_LEVEL / RB_LOG_FORMAT

server:
  # 只监听回环，HTTPS 由外层反代（Cloudflare Tunnel / Nginx / Caddy）提供。
  # 容器里要写 0.0.0.0:8484，否则宿主机映射不进来。
  listen: "127.0.0.1:8484"

  # 对外可访问的根地址，必须与你在 ChatGPT 里填的一致，且必须是 https。
  # OAuth 元数据、回调校验、资源标识全都以它为准，写错了整条授权链路都不通。
  base_url: "https://mcp.example.com"

  trust_proxy: true

  # 浏览器 Origin 白名单（防 DNS rebinding）。非浏览器客户端不带 Origin，不受影响。
  allowed_origins:
    - "https://chatgpt.com"
    - "https://chat.openai.com"
    - "https://claude.ai"

  session_ttl: 2h
  # 部分客户端不回传 Mcp-Session-Id，默认宽松处理；确定客户端规范可以打开。
  strict_sessions: false

  # 对应源码的获取地址，展示在服务根页面与 /healthz。
  # 本项目按 AGPL-3.0 授权：改了代码又对外提供服务的话，第 13 条要求让使用者
  # 能拿到你修改后的源码，此时请把这里指向你自己的仓库。
  source_url: "https://github.com/noir017/runabout"

  # OAuth 客户端注册信息与令牌存放处。该目录被自动加入文件工具黑名单，
  # 免得 agent 自己去改令牌库。
  data_dir: "/var/lib/runabout"

auth:
  enabled: true

  # 登录账号。password_hash 用 `runabout hash-password` 生成。
  # 这个口令等价于服务器 shell 权限，别用弱密码。
  users:
    - username: "noir017"
      password_hash: "$2a$12$替换成 hash-password 的输出"

  # ChatGPT 添加连接器时靠动态注册自助接入（RFC 7591），关掉就得手工预置客户端。
  allow_dynamic_registration: true
  # 非空时 /oauth/register 需要带该 Bearer 令牌，可挡住陌生人乱注册。
  registration_token: ""

  access_token_ttl: 1h
  refresh_token_ttl: 720h
  auth_code_ttl: 5m
  # 浏览器登录态有效期，用于再次授权时免密。设为 0 表示每次都要输密码。
  session_cookie_ttl: 12h

  # 放行不带令牌的 initialize 握手。默认关。
  # 有些客户端（实测 Gemini 的自定义连接器）在校验"这个 URL 是不是 MCP 服务器"
  # 时会先裸发一次 initialize，拿到 401 就判定无效，不会去走 WWW-Authenticate
  # 指出的 OAuth 流程。打开后代价是 serverInfo 与 instructions 对匿名可见，
  # 工具清单不受影响（tools/list、tools/call 仍要 Bearer）。
  allow_unauthenticated_initialize: false

  # 绕过 OAuth 的长期令牌，方便 curl 自检或别的 agent 直连。
  # 用 `runabout gen-token` 生成。不需要就留空。
  # 可选配置 allowed_targets 限制该令牌仅能访问指定机器（留空表示不限制）。
  static_tokens: []
  #  - name: "curl-debug"
  #    token: "……"
  #    allowed_targets: ["uniagent"]

  # 可选：按 OAuth client_id 或 client_name 限制客户端可访问的 target 白名单。
  # 留空表示不限制；配置后 tools/list、servers 与工具调用均只暴露并放行白名单机器。
  client_policies: []
  #  - client_name: "gemini-web-task"
  #    allowed_targets: ["uniagent"]

tools:
  # 想下线某些工具就填名字，例如 ["write"] 只保留 apply_patch 改文件。
  disabled: []

  # 只读查询工具。默认关闭。
  # 打开后 agent 可以用 query 查状态、日志、进程，不会触发确认；
  # 只接受 AST 判定为只读的命令，其他命令会被拒绝并提示改用 shell。
  query:
    enabled: false

  shell:
    path: "/bin/bash"
    default_timeout: 2m
    max_timeout: 1h
    # 默认工作目录，留空则用进程启动目录。
    default_workdir: "/workspace"
    max_output_bytes: 200000
    max_background: 16
    env: {}
    #  PATH: "/usr/local/bin:/usr/bin:/bin"

  fs:
    max_read_bytes: 4194304
    max_line_chars: 2000
    default_lines: 2000
    max_write_bytes: 8388608
    # 图片处理后的体积上限；超过就降质量、再缩尺寸。
    max_image_bytes: 1572864
    # 图片原始文件大小上限。图片不套用 max_read_bytes，
    # 否则几 MB 的截图在压缩前就会被拒。
    max_image_source_bytes: 33554432
    # 读图时自动缩放的长边上限（像素）。模型读图前也会缩到 1568 左右，
    # 再大只是白费带宽和内存。
    image_max_edge: 1568
    # 解码前的像素数上限，防止小文件解出巨图。
    max_image_pixels: 30000000
    # 同时处理的图片张数上限。
    max_image_concurrency: 2

    # 可选：读图后追加一段视觉模型生成的文字描述，用于客户端看不到图片时兜底。
    # base_url 和 model 都填才启用，默认关闭。接口需兼容 OpenAI 的 /chat/completions。
    vision:
      base_url: ""
      model: ""
      # API key 只从这个环境变量读取；留空表示接口不需要鉴权。
      api_key_env: ""
      timeout: 30s

  search:
    # 有 rg 就用 rg（快且尊重 .gitignore），没有则回退内置实现。
    use_ripgrep: true
    ripgrep_path: ""
    max_results: 200
    max_glob_results: 500
    timeout: 60s
    max_file_bytes: 4194304
    ignore_dirs: [".git", "node_modules", "vendor", ".venv", "venv",
                  "__pycache__", "dist", "build", "target", ".next", ".cache"]

fleet:
  # 不写 hosts 就是单机模式：工具里不会出现 target 参数，行为和以前一样。
  # 写了 hosts 之后，shell / read / search / glob / apply_patch 都会多一个 target，
  # enum 里列出下面所有机器名，默认 local（runabout 所在的容器）。
  ssh_command: ["ssh", "-o", "BatchMode=yes"]
  # servers 总览里单台机器的探测超时。
  probe_timeout: 10s
  # 可选。判断需审批的机器现在有没有授权：{host} 替换成机器名，退出码 0 表示已授权。
  # 它只查询本地状态，不会发起申请；留空时不探测需审批的机器。
  approval_check: ""
  hosts: []
  #  - name: web1
  #    desc: 对外服务宿主
  #    ssh: web1              # 不写就与 name 相同
  #    workdir: /srv/app      # 不写就是远端登录用户的家目录
  #    approval: false
  #    deny_paths: []         # 可选：仅对该机器生效的额外敏感路径黑名单
  #  - name: nas
  #    desc: 家庭 NAS / 容器主力
  #    approval: true

policy:
  # 二次确认令牌的有效期。
  confirm_ttl: 5m

  # 文件工具（read/write/apply_patch/search/glob/list_dir）的路径黑名单。
  # 注意 shell 工具按设计不受这里约束，它只受下面的 shell 规则约束。
  write_deny_paths:
    - "/proc/**"
    - "/sys/**"
    - "/dev/**"
    - "/boot/**"
    - "/run/**"
    - "/etc/shadow"
    - "/etc/sudoers"
    - "/etc/sudoers.d/**"
    - "**/.ssh/authorized_keys"

  # 凭据类文件：既禁止文件工具读取，也让 shell 里的 cat/base64 之类需要二次确认。
  # 远端路径按字面匹配，不解析符号链接；** 让规则在任意用户、任意机器上都命中。
  read_deny_paths:
    - "/etc/shadow"
    - "**/.ssh/id_*"
    - "**/.ssh/*_rsa"
    - "**/.ssh/*_ed25519"
    - "**/.aws/credentials"
    - "**/.config/gh/hosts.yml"
    - "**/.docker/config.json"
    - "**/.kube/config"
    - "**/.netrc"
    - "**/.fleetherd/web-bridge/**"

  # 全局追加的敏感路径黑名单（glob，支持 ** 与 ~），与内置规则做并集合并，不会覆盖默认规则。
  # 同时作用于 read / apply_patch / search / glob 以及 shell 的读/写重定向检查（命中即硬拒绝）。
  deny_paths:
    - "~/.fleetherd/web-bridge/**"

  # 可选：按 target 机器名追加的敏感路径黑名单。
  target_deny_paths: {}
  #  uniagent:
  #    - "~/.ant-browser/cookies/**"

  # 按 id 关掉内置 shell 规则（用 `runabout check-policy` 看 id）。
  disabled_shell_rules: []

  # 把内置的 deny 规则降级为"可二次确认"。例如你确实需要偶尔跑 rm -rf /etc：
  # downgrade_to_confirm: ["rm-recursive"]
  downgrade_to_confirm: []

  # 追加自己的规则。action 只能是 deny 或 confirm。
  extra_shell_rules: []
  #  - id: "no-terraform-destroy"
  #    action: "confirm"
  #    reason: "会销毁云上资源"
  #    hint: "先 terraform plan -destroy 看清楚要删什么"
  #    command: "terraform"
  #    arg_regex: '\bdestroy\b'

audit:
  enabled: true
  # 留空则写到 data_dir/audit.jsonl
  file: ""
  # 记录工具参数原文。关掉只留长度，隐私更好但排查更难。
  log_args: true
  max_args: 4000

# 可选集成扩展工具（默认全部关闭，不改变对外暴露的核心工具集）。
extensions:
  # skill 工具（list | search | read）：桥接目标机器上 fleetherd 的 BM25 技能搜索与读取。
  skill:
    enabled: false
    target: "local"
    binary: "fleetherd"
    timeout: 30s
    max_output_bytes: 200000

  # fleetherd_task 工具（agents | new | send | read | list | status）：
  # 严格白名单 + argv 传参转发 task-* 子命令；带 session_ref 时仅在工具内部读取 web-bridge 映射。
  fleetherd_task:
    enabled: false
    target: "local"
    binary: "fleetherd"
    web_bridge_dir: "~/.fleetherd/web-bridge"
    # 可选：用于拼装返回结果里的 Web UI 直达链接。
    web_ui_base_url: ""
    # 可选：无 session_ref 手聊模式下创建空白顶层协调话题的命令模板（{title} 会替换为标题）。
    empty_topic_command: []
    #  - "fleetherd"
    #  - "topic-new"
    #  - "--empty"
    #  - "--title"
    #  - "{title}"
    timeout: 60s
    max_output_bytes: 200000

# 可选：上游 MCP 透传（默认关闭）。配置后，白名单内的上游工具会以
# <prefix>_<工具名> 出现在 tools/list，tools/call 原样转发给上游。
# 每项在 url（HTTP）与 command（stdio）中二选一。
# runabout 不关心上游是什么；上游不可达只让对应工具报错，不影响自身工具。
upstreams: []
#  - name: example                      # 唯一，用于日志与报错
#    url: "http://127.0.0.1:8790/mcp"   # MCP Streamable HTTP 端点
#    token_env: "EXAMPLE_MCP_TOKEN"    # Bearer 令牌的环境变量名；留空表示不带鉴权
#    prefix: "ex"                       # 对外工具名为 ex_<工具名>
#    tools: ["list_items", "read_item"]  # 必填白名单，白名单外的一律不暴露
#    refresh_interval: 10m              # 工具列表刷新间隔，默认 10m
#    timeout: 60s                       # 单次上游请求超时，默认 60s
#    instructions: false                # 是否把上游 initialize 的说明追加到 runabout 说明里
#
#  - name: local                        # stdio 上游：启动时拉起子进程
#    command: ["node", "/opt/example/server.mjs"]
#    env:                               # 字面值；子进程只继承 PATH、HOME、LANG
#      EXAMPLE_MODE: "readonly"
#    workdir: "/opt/example"            # 必须是绝对路径
#    prefix: "lo"
